<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Gon_Tata的歌单</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Color Thief (提取主色) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            transition: background 0.8s ease;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }
        .container {
            max-width: 900px;
            width: 100%;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            transition: background 0.8s ease, backdrop-filter 0.8s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
        }
        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .cover i {
            font-size: 60px;
            color: rgba(255, 255, 255, 0.4);
        }
        .song-info {
            margin-bottom: 15px;
            width: 100%;
        }
        .song-info h2 {
            color: #fff;
            font-size: 1.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        .progress-area {
            width: 100%;
            margin-bottom: 20px;
        }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .progress-container span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            min-width: 40px;
        }
        .progress-track {
            flex: 1;
            position: relative;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
        }
        .progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            pointer-events: none;
            transition: width 0.1s;
        }
        #progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            margin: 0;
            z-index: 2;
            cursor: pointer;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #7c5cfc;
            box-shadow: 0 0 15px #7c5cfc;
            cursor: pointer;
            transition: background 0.3s;
        }
        #progress-bar::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: #7c5cfc;
            box-shadow: 0 0 15px #7c5cfc;
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ctrl-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        .play-btn {
            background: #7c5cfc;
            color: #fff;
            font-size: 22px;
            width: 60px;
            height: 60px;
            box-shadow: 0 5px 20px rgba(124, 92, 252, 0.4);
            transition: background 0.3s;
        }
        .play-btn:hover {
            transform: scale(1.05);
            color: #fff;
        }
        .playlist {
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            padding-left: 20px;
        }
        .playlist h3 {
            color: #fff;
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .playlist h3 i {
            color: #7c5cfc;
            margin-right: 10px;
        }
        #playlist-ul {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #playlist-ul::-webkit-scrollbar {
            width: 4px;
        }
        #playlist-ul::-webkit-scrollbar-thumb {
            background: #7c5cfc;
            border-radius: 10px;
        }
        #playlist-ul li {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        #playlist-ul li:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        #playlist-ul li.active {
            background: rgba(124, 92, 252, 0.2);
            color: #fff;
            border-left: 3px solid #7c5cfc;
        }
        #playlist-ul li .artist-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }
        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .playlist {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
                padding-left: 0;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- 左侧播放器 -->
        <div class="player">
            <div class="cover" id="cover"><i class="fas fa-music"></i></div>
            <div class="song-info">
                <h2 id="song-title">请选择一首歌曲</h2>
                <p id="song-artist">未知歌手</p>
            </div>
            <div class="progress-area">
                <div class="progress-container">
                    <span id="current-time">00:00</span>
                    <div class="progress-track">
                        <div class="progress-buffer" id="buffer-bar" style="width:0%"></div>
                        <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" />
                    </div>
                    <span id="total-time">00:00</span>
                </div>
            </div>
            <div class="controls">
                <button id="prev-btn" class="ctrl-btn"><i class="fas fa-step-backward"></i></button>
                <button id="play-btn" class="ctrl-btn play-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn" class="ctrl-btn"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>
        <!-- 右侧歌单 -->
        <div class="playlist">
            <h3><i class="fas fa-list-ul"></i> 播放列表</h3>
            <ul id="playlist-ul"></ul>
        </div>
    </div>

    <audio id="audio-player" preload="metadata"></audio>

    <script>
        // ============================================================
        // 1. 全局状态
        // ============================================================
        let songs = [];
        let currentIndex = 0;
        let isPlaying = false;

        // DOM 引用
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const bufferBar = document.getElementById('buffer-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const coverEl = document.getElementById('cover');
        const playlistUl = document.getElementById('playlist-ul');
        const mainContainer = document.getElementById('mainContainer');

        // ============================================================
        // 2. 工具函数
        // ============================================================
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '00:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        // ============================================================
        // 3. 主题色提取（含滚动条颜色 + 列表图标）
        // ============================================================
        function extractColorFromCover(coverUrl) {
            // 如果无封面，恢复默认配色
            if (!coverUrl) {
                document.body.style.background = 'linear-gradient(135deg, #1a1a2e, #16213e)';
                mainContainer.style.background = 'rgba(255, 255, 255, 0.05)';
                mainContainer.style.backdropFilter = 'blur(20px)';
                document.querySelector('.play-btn').style.background = '#7c5cfc';
                document.querySelector('.play-btn').style.boxShadow = '0 5px 20px rgba(124, 92, 252, 0.4)';
                // 移除动态样式（恢复默认滚动条和图标颜色）
                const oldStyle = document.getElementById('dynamic-theme');
                if (oldStyle) oldStyle.remove();
                return;
            }

            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                try {
                    const colorThief = new ColorThief();
                    const dominantColor = colorThief.getColor(img); // [r, g, b]
                    const [r, g, b] = dominantColor;

                    // 1. 页面背景：主色渐变到深色
                    document.body.style.background =
                        `linear-gradient(135deg, rgba(${r},${g},${b},0.85) 0%, #0f0f1a 100%)`;

                    // 2. 容器背景：半透明主色
                    mainContainer.style.background = `rgba(${r},${g},${b},0.15)`;
                    mainContainer.style.backdropFilter = 'blur(20px)';

                    // 3. 播放按钮颜色
                    document.querySelector('.play-btn').style.background = `rgb(${r},${g},${b})`;
                    document.querySelector('.play-btn').style.boxShadow = `0 5px 20px rgba(${r},${g},${b},0.4)`;

                    // 4. 动态样式（进度条滑块 + 歌单高亮 + 滚动条 + 列表图标）
                    const style = document.createElement('style');
                    style.textContent = `
                        /* 进度条滑块 */
                        #progress-bar::-webkit-slider-thumb {
                            background: rgb(${r},${g},${b}) !important;
                            box-shadow: 0 0 15px rgba(${r},${g},${b},0.6) !important;
                        }
                        #progress-bar::-moz-range-thumb {
                            background: rgb(${r},${g},${b}) !important;
                            box-shadow: 0 0 15px rgba(${r},${g},${b},0.6) !important;
                        }
                        /* 歌单高亮 */
                        #playlist-ul li.active {
                            background: rgba(${r},${g},${b},0.2) !important;
                            border-left-color: rgb(${r},${g},${b}) !important;
                        }
                        /* 歌单滚动条（WebKit 浏览器） */
                        #playlist-ul::-webkit-scrollbar-thumb {
                            background: rgb(${r},${g},${b}) !important;
                            border-radius: 10px;
                        }
                        /* 歌单滚动条（Firefox） */
                        #playlist-ul {
                            scrollbar-color: rgb(${r},${g},${b}) rgba(255,255,255,0.1);
                            scrollbar-width: thin;
                        }
                        /* 播放列表标题图标 */
                        .playlist h3 i {
                            color: rgb(${r},${g},${b}) !important;
                        }
                    `;
                    // 移除旧的动态样式
                    const oldStyle = document.getElementById('dynamic-theme');
                    if (oldStyle) oldStyle.remove();
                    style.id = 'dynamic-theme';
                    document.head.appendChild(style);

                } catch (e) {
                    console.warn('颜色提取失败，使用默认主题', e);
                }
            };
            img.onerror = function() {
                console.warn('封面图片加载失败，无法提取颜色');
                // 无封面时恢复默认
                extractColorFromCover(null);
            };
            img.src = coverUrl;
        }
        // ============================================================
        // 4. 加载歌曲
        // ============================================================
        function loadSong(index) {
            const song = songs[index];
            if (!song) return;

            audio.src = song.src;
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;

            // 高亮歌单
            document.querySelectorAll('#playlist-ul li').forEach((li, i) => {
                li.classList.toggle('active', i === index);
            });

            // 设置封面
            if (song.cover) {
                coverEl.style.backgroundImage = `url(${song.cover})`;
                coverEl.style.backgroundSize = 'cover';
                coverEl.style.backgroundPosition = 'center';
                coverEl.innerHTML = '';
                // 提取主题色
                extractColorFromCover(song.cover);
            } else {
                coverEl.style.backgroundImage = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                coverEl.innerHTML = '<i class="fas fa-music"></i>';
                extractColorFromCover(null); // 恢复默认
            }

            // 重置进度
            progressBar.value = 0;
            currentTimeEl.textContent = '00:00';
            totalTimeEl.textContent = '00:00';
            bufferBar.style.width = '0%';

            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        // ============================================================
        // 5. 播放控制
        // ============================================================
        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    isPlaying = true;
                }).catch(() => {});
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
            }
        }

        function prevSong() {
            if (songs.length === 0) return;
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            if (isPlaying) audio.play().catch(() => {});
        }

        function nextSong() {
            if (songs.length === 0) return;
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
            if (isPlaying) audio.play().catch(() => {});
        }

        // ============================================================
        // 6. 进度更新（简单，不处理回跳问题）
        // ============================================================
        function updateProgress() {
            if (!audio.duration || !isFinite(audio.duration) || isNaN(audio.duration)) return;
            progressBar.value = audio.currentTime;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            totalTimeEl.textContent = formatTime(audio.duration);
            if (audio.buffered.length > 0) {
                const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
                const bufferPercent = (bufferedEnd / audio.duration) * 100;
                bufferBar.style.width = Math.min(bufferPercent, 100) + '%';
            }
        }

        function setProgress(e) {
            const val = parseFloat(e.target.value);
            if (!audio.duration || !isFinite(audio.duration) || isNaN(audio.duration)) return;
            if (val >= 0 && val <= audio.duration) {
                audio.currentTime = val;
                currentTimeEl.textContent = formatTime(val);
            }
        }

        // ============================================================
        // 7. 歌单渲染
        // ============================================================
        function renderPlaylist() {
            playlistUl.innerHTML = '';
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${song.title}</span><span class="artist-text">${song.artist}</span>`;
                li.addEventListener('click', () => {
                    currentIndex = index;
                    loadSong(currentIndex);
                    if (!isPlaying) {
                        audio.play().then(() => {
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            isPlaying = true;
                        }).catch(() => {});
                    }
                });
                playlistUl.appendChild(li);
            });
            if (songs.length > 0) loadSong(0);
        }

        // ============================================================
        // 8. 加载播放列表
        // ============================================================
        function loadPlaylist() {
            fetch('playlist.json')
                .then(res => {
                    if (!res.ok) throw new Error('playlist.json 不存在');
                    return res.json();
                })
                .then(data => {
                    songs = data;
                    renderPlaylist();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('song-title').textContent = '❌ 加载失败';
                    document.getElementById('song-artist').textContent = '请检查 playlist.json';
                });
        }

        // ============================================================
        // 9. 事件绑定
        // ============================================================
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', nextSong);
        progressBar.addEventListener('input', setProgress);

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && isFinite(audio.duration)) {
                progressBar.max = audio.duration;
                progressBar.step = 0.1;
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault();
                togglePlay(); }
        });

        // ============================================================
        // 10. 启动
        // ============================================================
        loadPlaylist();
    </script>
</body>
</html>
